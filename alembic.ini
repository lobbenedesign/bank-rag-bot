[alembic]
script_location = alembic
prepend_sys_path = . src
# actual URL is read from Settings.postgres_dsn at runtime (see alembic/env.py);
# this placeholder only satisfies alembic's config parser.
sqlalchemy.url = postgresql+asyncpg://bank_rag:bank_rag@localhost:5432/bank_rag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
